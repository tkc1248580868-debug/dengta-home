name: Apply Supabase migrations

# Applies backend/supabase/*.sql to a self-hosted Supabase project in numeric
# order. This exists so a database can be initialised without pasting ~130KB of
# SQL into the dashboard editor by hand — useful on a phone, and repeatable
# afterwards, since every migration is written to be safe to re-run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm running the migrations.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "请在 confirm 输入框里填 apply 再运行。" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve connection string
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Copying the connection string out of the dashboard is the hardest
          # step on a phone: the copy button sits off-screen. Given just the
          # project ref and password, find the right pooler host by trying the
          # regional endpoints until one authenticates.
          if [ -z "$SUPABASE_DB_URL" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            if [ -z "$SUPABASE_DB_PASSWORD" ]; then
              echo "有 SUPABASE_PROJECT_REF 但缺少 SUPABASE_DB_PASSWORD。" >&2
              exit 1
            fi
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SUPABASE_DB_PASSWORD")"
            echo "::add-mask::$encoded"
            echo "正在自动查找 $SUPABASE_PROJECT_REF 所在的区域……"
            found=""
            for region in \
              ap-southeast-1 ap-northeast-1 ap-northeast-2 ap-southeast-2 \
              ap-south-1 ap-east-1 us-east-1 us-east-2 us-west-1 us-west-2 \
              eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 \
              eu-north-1 sa-east-1 ca-central-1; do
              for prefix in aws-0 aws-1; do
                host="${prefix}-${region}.pooler.supabase.com"
                candidate="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded}@${host}:5432/postgres?connect_timeout=5"
                if error="$(psql "$candidate" -Atqc "select 1;" 2>&1 >/dev/null)"; then
                  echo "找到了：$host"
                  found="$candidate"
                  break 2
                fi
                # A rejected password means this IS the right region, so stop
                # rather than trying every remaining endpoint with a password
                # already known to be wrong.
                case "$error" in
                  *"password authentication failed"*|*"Wrong password"*)
                    echo "在 $host 上找到了项目，但密码不对。" >&2
                    echo "请核对 SUPABASE_DB_PASSWORD；忘记了可在 Supabase 的 Connect 页面点 Reset database password 重设。" >&2
                    exit 1
                    ;;
                esac
              done
            done
            if [ -z "$found" ]; then
              echo "所有区域都连不上。请检查 SUPABASE_PROJECT_REF 是否正确。" >&2
              echo "项目编号取自项目网址 https://your-project.supabase.co 里 your-project 的那一段。" >&2
              exit 1
            fi
            echo "::add-mask::$found"
            echo "DB_URL=$found" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "缺少 Repository Secret。二选一：" >&2
            echo "  1) SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD（推荐，不用复制连接串）" >&2
            echo "  2) SUPABASE_DB_URL（+ 占位符未替换时再加 SUPABASE_DB_PASSWORD）" >&2
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "SUPABASE_DB_URL 必须是 postgres:// 或 postgresql:// 开头的连接串。" >&2
              exit 1
              ;;
          esac
          # GitHub runners have no IPv6, and Supabase's direct host is
          # IPv6-only, so the pooler host is the one that actually connects.
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) ;;
            *)
              echo "::warning::连接串似乎不是 pooler 主机。GitHub 跑在 IPv4 上，" \
                   "请在 Supabase 的 Connect 里选 Session pooler 那一条。"
              ;;
          esac

          # The dashboard hands out the string with a [YOUR-PASSWORD] placeholder.
          # Substituting it here means the password can be pasted as its own
          # secret, with no hand-editing of the string on a phone keyboard, and
          # it gets URL-encoded so punctuation in the password cannot corrupt
          # the URI — the dashboard warns about exactly that.
          url="$SUPABASE_DB_URL"
          case "$url" in
            *"[YOUR-PASSWORD]"*)
              if [ -z "$SUPABASE_DB_PASSWORD" ]; then
                echo "连接串里还留着 [YOUR-PASSWORD] 占位符。" >&2
                echo "请再加一个 Repository Secret：SUPABASE_DB_PASSWORD，值是数据库密码本身。" >&2
                exit 1
              fi
              encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SUPABASE_DB_PASSWORD")"
              echo "::add-mask::$encoded"
              url="${url//\[YOUR-PASSWORD\]/$encoded}"
              echo "已把密码填入连接串。"
              ;;
            *)
              echo "连接串里没有占位符，按原样使用。"
              ;;
          esac
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      - name: Verify connection
        run: |
          psql "$DB_URL" -Atqc "select 'connected to ' || current_database();"

      - name: Apply migrations in order
        run: |
          set -u
          failed=0
          {
            echo "## 数据库迁移结果"
            echo
            echo "| 脚本 | 结果 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in backend/supabase/*.sql; do
            name="$(basename "$file")"
            if output="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$file" 2>&1)"; then
              echo "✅ $name"
              echo "| \`$name\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "❌ $name"
              # Migration files contain no secrets, so their errors are safe to
              # print; the connection string is never echoed.
              echo "$output" | grep -i "error" | head -5
              echo "| \`$name\` | ❌ 见日志 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "**$failed 个脚本失败。**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**全部通过。**" >> "$GITHUB_STEP_SUMMARY"

      - name: Report what was created
        run: |
          tables="$(psql "$DB_URL" -Atqc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")"
          secured="$(psql "$DB_URL" -Atqc "select count(*) from pg_tables where schemaname='public' and rowsecurity=true;")"
          {
            echo "建出 **$tables** 张表，其中 **$secured** 张启用了行级安全。"
            echo
            echo "两个数字应该相等且为 34。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tables=$tables secured=$secured"
