name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression checks
        working-directory: frontend
        run: |
          npm test
          npm run lint

      - name: Validate self-hosted build settings
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          test -n "$VITE_API_URL" || missing="$missing VITE_API_URL"
          test -n "$VITE_SUPABASE_URL" || missing="$missing VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY" || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "Missing Repository Secret(s):$missing" >&2
            echo "Add them under Settings > Secrets and variables > Actions. See docs/ANDROID.md." >&2
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) ;;
            *)
              echo "VITE_API_URL must use https://. The Android shell sets cleartext=false." >&2
              exit 1
              ;;
          esac

      - name: Build DengTa web app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Allow Gradle wrapper to run
        run: chmod +x frontend/android/gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug
        env:
          DENGTA_BACKEND_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verify debug APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DengTa-home-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
